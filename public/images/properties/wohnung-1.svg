<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a5c5c"/>
      <stop offset="50%" style="stop-color:#2D7A7A"/>
      <stop offset="100%" style="stop-color:#3a9e9e"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#e0f0f0;stop-opacity:0.85"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="400" cy="300" r="280" fill="rgba(255,255,255,0.04)"/>
  <circle cx="400" cy="300" r="200" fill="rgba(255,255,255,0.03)"/>
  <!-- Apartment building icon -->
  <g transform="translate(400, 230)" opacity="0.93">
    <!-- Main building -->
    <rect x="-90" y="-140" width="180" height="260" rx="4" fill="url(#iconGrad)" opacity="0.35"/>
    <rect x="-90" y="-140" width="180" height="260" rx="4" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
    <!-- Roof edge -->
    <rect x="-95" y="-145" width="190" height="10" rx="3" fill="url(#iconGrad)" opacity="0.7"/>
    <!-- Window rows -->
    <!-- Row 1 -->
    <rect x="-65" y="-120" width="30" height="35" rx="2" fill="#2D7A7A" opacity="0.5"/>
    <rect x="-15" y="-120" width="30" height="35" rx="2" fill="#2D7A7A" opacity="0.5"/>
    <rect x="35" y="-120" width="30" height="35" rx="2" fill="#2D7A7A" opacity="0.5"/>
    <!-- Row 2 -->
    <rect x="-65" y="-70" width="30" height="35" rx="2" fill="#2D7A7A" opacity="0.5"/>
    <rect x="-15" y="-70" width="30" height="35" rx="2" fill="#2D7A7A" opacity="0.5"/>
    <rect x="35" y="-70" width="30" height="35" rx="2" fill="#2D7A7A" opacity="0.5"/>
    <!-- Row 3 -->
    <rect x="-65" y="-20" width="30" height="35" rx="2" fill="#2D7A7A" opacity="0.5"/>
    <rect x="-15" y="-20" width="30" height="35" rx="2" fill="#2D7A7A" opacity="0.5"/>
    <rect x="35" y="-20" width="30" height="35" rx="2" fill="#2D7A7A" opacity="0.5"/>
    <!-- Row 4 - highlighted unit -->
    <rect x="-65" y="30" width="30" height="35" rx="2" fill="#2D7A7A" opacity="0.5"/>
    <rect x="-15" y="30" width="30" height="35" rx="2" fill="rgba(255,255,255,0.7)" opacity="0.8"/>
    <rect x="35" y="30" width="30" height="35" rx="2" fill="#2D7A7A" opacity="0.5"/>
    <!-- Highlight glow on selected unit -->
    <rect x="-18" y="27" width="36" height="41" rx="3" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="2"/>
    <!-- Window cross patterns -->
    <g stroke="rgba(255,255,255,0.3)" stroke-width="1">
      <line x1="-50" y1="-120" x2="-50" y2="-85"/><line x1="-65" y1="-102" x2="-35" y2="-102"/>
      <line x1="0" y1="-120" x2="0" y2="-85"/><line x1="-15" y1="-102" x2="15" y2="-102"/>
      <line x1="50" y1="-120" x2="50" y2="-85"/><line x1="35" y1="-102" x2="65" y2="-102"/>
      <line x1="-50" y1="-70" x2="-50" y2="-35"/><line x1="-65" y1="-52" x2="-35" y2="-52"/>
      <line x1="0" y1="-70" x2="0" y2="-35"/><line x1="-15" y1="-52" x2="15" y2="-52"/>
      <line x1="50" y1="-70" x2="50" y2="-35"/><line x1="35" y1="-52" x2="65" y2="-52"/>
      <line x1="-50" y1="-20" x2="-50" y2="15"/><line x1="-65" y1="-2" x2="-35" y2="-2"/>
      <line x1="0" y1="-20" x2="0" y2="15"/><line x1="-15" y1="-2" x2="15" y2="-2"/>
      <line x1="50" y1="-20" x2="50" y2="15"/><line x1="35" y1="-2" x2="65" y2="-2"/>
    </g>
    <!-- Entrance door -->
    <rect x="-15" y="85" width="30" height="35" rx="2" fill="url(#iconGrad)" opacity="0.7"/>
    <circle cx="-5" cy="105" r="2.5" fill="#2D7A7A" opacity="0.6"/>
  </g>
  <!-- Ground line -->
  <line x1="200" y1="350" x2="600" y2="350" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <!-- Text label -->
  <text x="400" y="425" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="600" fill="white" letter-spacing="2" opacity="0.95">Eigentumswohnung</text>
  <text x="400" y="460" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="white" letter-spacing="4" opacity="0.5">KESERLI IMMOBILIEN</text>
  <!-- Corner accents -->
  <line x1="30" y1="30" x2="80" y2="30" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <line x1="30" y1="30" x2="30" y2="80" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <line x1="720" y1="570" x2="770" y2="570" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <line x1="770" y1="520" x2="770" y2="570" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
</svg>