<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a5c5c"/>
      <stop offset="50%" style="stop-color:#2D7A7A"/>
      <stop offset="100%" style="stop-color:#3a9e9e"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#e0f0f0;stop-opacity:0.85"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="400" cy="300" r="280" fill="rgba(255,255,255,0.04)"/>
  <circle cx="400" cy="300" r="200" fill="rgba(255,255,255,0.03)"/>
  <!-- Kitchen icon -->
  <g transform="translate(400, 250)" opacity="0.93">
    <!-- Countertop -->
    <rect x="-150" y="20" width="300" height="12" rx="3" fill="url(#iconGrad)" opacity="0.9"/>
    <!-- Cabinet body -->
    <rect x="-150" y="32" width="300" height="100" rx="3" fill="url(#iconGrad)" opacity="0.4"/>
    <!-- Cabinet doors -->
    <rect x="-140" y="42" width="85" height="80" rx="2" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
    <rect x="-42" y="42" width="85" height="80" rx="2" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
    <rect x="55" y="42" width="85" height="80" rx="2" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
    <!-- Cabinet handles -->
    <line x1="-90" y1="75" x2="-90" y2="95" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="8" y1="75" x2="8" y2="95" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="105" y1="75" x2="105" y2="95" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Upper cabinets -->
    <rect x="-150" y="-110" width="120" height="80" rx="3" fill="url(#iconGrad)" opacity="0.35"/>
    <rect x="-140" y="-100" width="100" height="60" rx="2" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    <rect x="30" y="-110" width="120" height="80" rx="3" fill="url(#iconGrad)" opacity="0.35"/>
    <rect x="40" y="-100" width="100" height="60" rx="2" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    <!-- Range hood -->
    <polygon points="-30,-25 30,-25 45,-5 -45,-5" fill="url(#iconGrad)" opacity="0.5"/>
    <rect x="-45" y="-5" width="90" height="8" rx="2" fill="url(#iconGrad)" opacity="0.6"/>
    <!-- Stove burners -->
    <circle cx="-20" cy="14" r="8" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>
    <circle cx="20" cy="14" r="8" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>
    <circle cx="-20" cy="14" r="3" fill="rgba(255,255,255,0.4)"/>
    <circle cx="20" cy="14" r="3" fill="rgba(255,255,255,0.4)"/>
    <!-- Sink (right side) -->
    <ellipse cx="110" cy="14" rx="22" ry="8" fill="#2D7A7A" opacity="0.5" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
    <!-- Faucet -->
    <path d="M110,6 Q110,-8 120,-8 L120,-5" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- Ground line -->
  <line x1="200" y1="385" x2="600" y2="385" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <!-- Text label -->
  <text x="400" y="450" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="600" fill="white" letter-spacing="2" opacity="0.95">Küche</text>
  <text x="400" y="485" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="white" letter-spacing="4" opacity="0.5">KESERLI IMMOBILIEN</text>
  <!-- Corner accents -->
  <line x1="30" y1="30" x2="80" y2="30" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <line x1="30" y1="30" x2="30" y2="80" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <line x1="720" y1="570" x2="770" y2="570" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <line x1="770" y1="520" x2="770" y2="570" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
</svg>