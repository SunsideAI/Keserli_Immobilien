<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a5c5c"/>
      <stop offset="50%" style="stop-color:#2D7A7A"/>
      <stop offset="100%" style="stop-color:#3a9e9e"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#e0f0f0;stop-opacity:0.85"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="400" cy="300" r="280" fill="rgba(255,255,255,0.04)"/>
  <circle cx="400" cy="300" r="200" fill="rgba(255,255,255,0.03)"/>
  <!-- Garden scene -->
  <g transform="translate(400, 220)" opacity="0.93">
    <!-- Fence -->
    <g fill="url(#iconGrad)" opacity="0.5" stroke="rgba(255,255,255,0.3)" stroke-width="1">
      <!-- Fence posts -->
      <rect x="-160" y="60" width="8" height="60" rx="1"/>
      <rect x="-120" y="60" width="8" height="60" rx="1"/>
      <rect x="-80" y="60" width="8" height="60" rx="1"/>
      <rect x="-40" y="60" width="8" height="60" rx="1"/>
      <rect x="0" y="60" width="8" height="60" rx="1"/>
      <rect x="40" y="60" width="8" height="60" rx="1"/>
      <rect x="80" y="60" width="8" height="60" rx="1"/>
      <rect x="120" y="60" width="8" height="60" rx="1"/>
      <rect x="155" y="60" width="8" height="60" rx="1"/>
      <!-- Fence rails -->
      <rect x="-160" y="72" width="323" height="5" rx="1"/>
      <rect x="-160" y="95" width="323" height="5" rx="1"/>
      <!-- Post tops (pointed) -->
      <polygon points="-160,60 -152,60 -156,52"/>
      <polygon points="-120,60 -112,60 -116,52"/>
      <polygon points="-80,60 -72,60 -76,52"/>
      <polygon points="-40,60 -32,60 -36,52"/>
      <polygon points="0,60 8,60 4,52"/>
      <polygon points="40,60 48,60 44,52"/>
      <polygon points="80,60 88,60 84,52"/>
      <polygon points="120,60 128,60 124,52"/>
      <polygon points="155,60 163,60 159,52"/>
    </g>
    <!-- Large tree -->
    <g transform="translate(-80, -20)">
      <rect x="-8" y="30" width="16" height="50" rx="3" fill="url(#iconGrad)" opacity="0.6"/>
      <ellipse cx="0" cy="-5" rx="50" ry="42" fill="url(#iconGrad)" opacity="0.35"/>
      <ellipse cx="0" cy="-20" rx="38" ry="32" fill="url(#iconGrad)" opacity="0.3"/>
    </g>
    <!-- Small bush left -->
    <ellipse cx="-140" cy="55" rx="25" ry="18" fill="url(#iconGrad)" opacity="0.3"/>
    <!-- Small bush right -->
    <ellipse cx="140" cy="55" rx="30" ry="20" fill="url(#iconGrad)" opacity="0.3"/>
    <!-- Flower bed -->
    <g transform="translate(60, 20)">
      <!-- Flowers -->
      <g>
        <line x1="0" y1="10" x2="0" y2="40" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
        <circle cx="0" cy="5" r="10" fill="url(#iconGrad)" opacity="0.5"/>
        <circle cx="0" cy="5" r="4" fill="#2D7A7A" opacity="0.5"/>
      </g>
      <g transform="translate(25, 8)">
        <line x1="0" y1="10" x2="0" y2="32" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
        <circle cx="0" cy="5" r="8" fill="url(#iconGrad)" opacity="0.5"/>
        <circle cx="0" cy="5" r="3" fill="#2D7A7A" opacity="0.5"/>
      </g>
      <g transform="translate(50, 3)">
        <line x1="0" y1="10" x2="0" y2="37" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
        <circle cx="0" cy="5" r="9" fill="url(#iconGrad)" opacity="0.5"/>
        <circle cx="0" cy="5" r="3.5" fill="#2D7A7A" opacity="0.5"/>
      </g>
    </g>
    <!-- Garden path -->
    <g fill="url(#iconGrad)" opacity="0.2">
      <ellipse cx="10" cy="130" rx="18" ry="6"/>
      <ellipse cx="5" cy="145" rx="16" ry="5"/>
      <ellipse cx="12" cy="160" rx="17" ry="5"/>
    </g>
    <!-- Grass -->
    <g stroke="rgba(255,255,255,0.35)" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M-150,120 Q-145,105 -140,120"/>
      <path d="M-110,120 Q-105,100 -100,120"/>
      <path d="M50,120 Q55,105 60,120"/>
      <path d="M130,120 Q135,100 140,120"/>
    </g>
  </g>
  <!-- Ground line -->
  <line x1="180" y1="340" x2="620" y2="340" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <!-- Text label -->
  <text x="400" y="420" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="600" fill="white" letter-spacing="2" opacity="0.95">Garten</text>
  <text x="400" y="455" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="white" letter-spacing="4" opacity="0.5">KESERLI IMMOBILIEN</text>
  <!-- Corner accents -->
  <line x1="30" y1="30" x2="80" y2="30" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <line x1="30" y1="30" x2="30" y2="80" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <line x1="720" y1="570" x2="770" y2="570" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <line x1="770" y1="520" x2="770" y2="570" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
</svg>