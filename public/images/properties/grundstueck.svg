<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a5c5c"/>
      <stop offset="50%" style="stop-color:#2D7A7A"/>
      <stop offset="100%" style="stop-color:#3a9e9e"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#e0f0f0;stop-opacity:0.85"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="400" cy="300" r="280" fill="rgba(255,255,255,0.04)"/>
  <circle cx="400" cy="300" r="200" fill="rgba(255,255,255,0.03)"/>
  <!-- Land plot / Baugrundstück -->
  <g transform="translate(400, 240)" opacity="0.93">
    <!-- Plot outline (perspective view) -->
    <polygon points="-140,-60 100,-80 130,60 -110,80" fill="url(#iconGrad)" opacity="0.15" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-dasharray="8,4"/>
    <!-- Plot fill pattern (grid) -->
    <g stroke="rgba(255,255,255,0.1)" stroke-width="0.5">
      <line x1="-120" y1="-40" x2="115" y2="-55"/>
      <line x1="-115" y1="-10" x2="120" y2="-25"/>
      <line x1="-112" y1="20" x2="125" y2="5"/>
      <line x1="-108" y1="50" x2="128" y2="35"/>
      <line x1="-100" y1="-60" x2="-75" y2="80"/>
      <line x1="-50" y1="-65" x2="-30" y2="80"/>
      <line x1="0" y1="-70" x2="15" y2="75"/>
      <line x1="50" y1="-75" x2="70" y2="70"/>
    </g>
    <!-- Corner stakes -->
    <g fill="url(#iconGrad)" opacity="0.8">
      <rect x="-145" y="-70" width="6" height="25" rx="1"/>
      <polygon points="-142,-72 -139,-80 -136,-72"/>
      <rect x="98" y="-90" width="6" height="25" rx="1"/>
      <polygon points="101,-92 104,-100 107,-92"/>
      <rect x="128" y="50" width="6" height="25" rx="1"/>
      <polygon points="131,48 134,40 137,48"/>
      <rect x="-115" y="70" width="6" height="25" rx="1"/>
      <polygon points="-112,68 -109,60 -106,68"/>
    </g>
    <!-- Measurement lines -->
    <g stroke="rgba(255,255,255,0.4)" stroke-width="1" stroke-dasharray="4,3" fill="none">
      <line x1="-140" y1="-90" x2="100" y2="-110"/>
      <line x1="-140" y1="-95" x2="-140" y2="-85"/>
      <line x1="100" y1="-115" x2="100" y2="-105"/>
    </g>
    <text x="-20" y="-100" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="white" opacity="0.5">25 m</text>
    <g stroke="rgba(255,255,255,0.4)" stroke-width="1" stroke-dasharray="4,3" fill="none">
      <line x1="150" y1="-80" x2="165" y2="60"/>
      <line x1="145" y1="-80" x2="155" y2="-80"/>
      <line x1="160" y1="60" x2="170" y2="60"/>
    </g>
    <text x="175" y="-5" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="white" opacity="0.5">30 m</text>
    <!-- Small tree on plot -->
    <g transform="translate(60, -20)">
      <rect x="-3" y="10" width="6" height="18" rx="2" fill="url(#iconGrad)" opacity="0.4"/>
      <circle cx="0" cy="2" r="14" fill="url(#iconGrad)" opacity="0.2"/>
    </g>
    <!-- Area indicator -->
    <text x="-10" y="15" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="white" opacity="0.4" font-weight="300">750 m²</text>
    <!-- Compass rose -->
    <g transform="translate(-170, -80)" opacity="0.5">
      <circle cx="0" cy="0" r="20" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
      <polygon points="0,-18 3,-5 -3,-5" fill="url(#iconGrad)" opacity="0.8"/>
      <polygon points="0,18 3,5 -3,5" fill="url(#iconGrad)" opacity="0.3"/>
      <polygon points="-18,0 -5,3 -5,-3" fill="url(#iconGrad)" opacity="0.3"/>
      <polygon points="18,0 5,3 5,-3" fill="url(#iconGrad)" opacity="0.3"/>
      <text x="0" y="-23" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="white" opacity="0.6" font-weight="600">N</text>
    </g>
  </g>
  <!-- Text label -->
  <text x="400" y="440" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="600" fill="white" letter-spacing="2" opacity="0.95">Baugrundstück</text>
  <text x="400" y="475" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="white" letter-spacing="4" opacity="0.5">KESERLI IMMOBILIEN</text>
  <!-- Corner accents -->
  <line x1="30" y1="30" x2="80" y2="30" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <line x1="30" y1="30" x2="30" y2="80" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <line x1="720" y1="570" x2="770" y2="570" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <line x1="770" y1="520" x2="770" y2="570" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
</svg>