<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a5c5c"/>
      <stop offset="50%" style="stop-color:#2D7A7A"/>
      <stop offset="100%" style="stop-color:#3a9e9e"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#e0f0f0;stop-opacity:0.85"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)" rx="0"/>
  <!-- Subtle pattern overlay -->
  <rect width="800" height="600" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <circle cx="400" cy="300" r="280" fill="rgba(255,255,255,0.04)"/>
  <circle cx="400" cy="300" r="200" fill="rgba(255,255,255,0.03)"/>
  <!-- House icon -->
  <g transform="translate(400, 240)" fill="url(#iconGrad)" stroke="rgba(255,255,255,0.3)" stroke-width="1">
    <!-- Roof -->
    <polygon points="0,-120 -140,0 -110,0 -110,0 110,0 110,0 140,0" fill="url(#iconGrad)" opacity="0.95"/>
    <!-- Chimney -->
    <rect x="50" y="-100" width="25" height="50" rx="2" fill="url(#iconGrad)" opacity="0.9"/>
    <!-- House body -->
    <rect x="-100" y="0" width="200" height="130" rx="3" fill="url(#iconGrad)" opacity="0.9"/>
    <!-- Door -->
    <rect x="-20" y="50" width="40" height="80" rx="3" fill="#2D7A7A" opacity="0.7"/>
    <circle cx="-8" cy="95" r="3" fill="rgba(255,255,255,0.8)"/>
    <!-- Left window -->
    <rect x="-80" y="25" width="40" height="40" rx="3" fill="#2D7A7A" opacity="0.5"/>
    <line x1="-60" y1="25" x2="-60" y2="65" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    <line x1="-80" y1="45" x2="-40" y2="45" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    <!-- Right window -->
    <rect x="40" y="25" width="40" height="40" rx="3" fill="#2D7A7A" opacity="0.5"/>
    <line x1="60" y1="25" x2="60" y2="65" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    <line x1="40" y1="45" x2="80" y2="45" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    <!-- Roof peak window -->
    <circle cx="0" cy="-50" r="18" fill="#2D7A7A" opacity="0.5"/>
    <circle cx="0" cy="-50" r="18" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
  </g>
  <!-- Ground line -->
  <line x1="200" y1="370" x2="600" y2="370" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <!-- Text label -->
  <text x="400" y="440" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="600" fill="white" letter-spacing="2" opacity="0.95">Einfamilienhaus</text>
  <text x="400" y="475" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="white" letter-spacing="4" opacity="0.5" text-transform="uppercase">KESERLI IMMOBILIEN</text>
  <!-- Corner accents -->
  <line x1="30" y1="30" x2="80" y2="30" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <line x1="30" y1="30" x2="30" y2="80" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <line x1="720" y1="570" x2="770" y2="570" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <line x1="770" y1="520" x2="770" y2="570" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
</svg>